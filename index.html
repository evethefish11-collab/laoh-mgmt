<head>
<meta charset="utf-8">

<title>ລະບົບຄຸ້ມຄອງ LaoH</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--surface:#fff;--ink:#22271F;--muted:#6D6A5D;--line:#DDD7C6;--dot:#3A3833;--accentbg:#FAECE7;--accent:#993C1D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Noto Sans Lao','Segoe UI',sans-serif;padding:2rem 1rem 4rem}
.wrap{max-width:720px;margin:0 auto}
.card{background:var(--surface);border:0.5px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;border:0.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;background:var(--bg)}
button{border:0.5px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 16px;font-size:13px;cursor:pointer;margin-top:12px;font-family:inherit}
button:hover{opacity:.9}
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:6px 12px;border:0.5px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface)}
.tab.active{background:var(--dot);color:#fff;border-color:var(--dot)}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat .n{font-size:20px;font-weight:600}
.stat .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:0.5px solid var(--line);text-align:left}
.err{color:#A32D2D;font-size:12px;margin-top:6px;min-height:14px}
.note{font-size:11px;color:var(--accent);background:var(--accentbg);padding:6px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
.tree{display:flex;flex-direction:column;align-items:center}
.node{border:0.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;text-align:center;background:var(--surface)}
.node .t{font-weight:600;font-size:13px;margin:0}
.node .s{font-size:11px;color:var(--muted);margin:2px 0 0}
.connector{width:1px;height:16px;background:var(--line)}
.dept-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;position:relative;padding-top:16px;margin-top:-1px}
.dept-row::before{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;background:var(--line)}
.col{display:flex;flex-direction:column;align-items:center;width:140px}
.col .stub{width:1px;height:16px;background:var(--line)}
.staffwrap{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:8px;width:100%}
.chip{border:0.5px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;background:var(--surface);cursor:pointer;width:100%;text-align:center}
.chip.active{border-color:var(--dot);color:var(--dot);font-weight:600}
.node.active{border-color:var(--dot);border-width:1.5px}
.board{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.board-head{background:#0F3D2E;color:#fff;padding:14px 16px;font-weight:600;font-size:15px}
.board-sub{background:#F6F3EC;padding:10px 16px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
table.plan{width:100%;border-collapse:collapse;table-layout:fixed}
table.plan th{background:#0F3D2E;color:#fff;font-size:12px;font-weight:600;padding:9px 8px;text-align:left}
table.plan td{padding:8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top;overflow-wrap:break-word}
table.plan th:nth-child(1),table.plan td:nth-child(1){width:26%}
table.plan th:nth-child(2),table.plan td:nth-child(2){width:44%}
table.plan th:nth-child(3),table.plan td:nth-child(3){width:30%}
table.plan tr:last-child td{border-bottom:none}
.statusrow{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.radio{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:var(--muted)}
.radio .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.radio.active .dot{background:currentColor;border-color:currentColor}
.radio.active{font-weight:600}
.arrow-btn{cursor:pointer;color:var(--muted);font-size:11px;margin-right:4px}
.update-row td{background:#F6F3EC}
</style>

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ===== ຟັງຊັນເຊື່ອມຕໍ່ Firestore =====
function hydrateTaskDoc(doc){
  const d = doc.data();
  const conv = (arr) => (arr||[]).map(x => ({...x, at: x.at && x.at.toDate ? x.at.toDate() : x.at}));
  return { id: doc.id, ...d, updates: conv(d.updates), editHistory: conv(d.editHistory) };
}

// ===== Realtime sync: ຟັງການປ່ຽນແປງງານແບບສົດ ຂ້າມອຸປະກອນ =====
let tasksUnsubscribe = null;
let openExpandId = null;
function subscribeToTasks(){
  return new Promise((resolve)=>{
    if(tasksUnsubscribe) tasksUnsubscribe();
    let gotFirst = false;
    tasksUnsubscribe = db.collection('mgmt_tasks').onSnapshot(snap=>{
      MOCK_TASKS = snap.docs.map(hydrateTaskDoc);
      if(!gotFirst){ gotFirst = true; resolve(); return; }
      if(!session) return;
      if(activeTab==='orgchart'){ renderOrgChart(); showOrg(currentOrgId); }
      else if(activeTab==='tasks'){ loadTasksAdmin(); }
      else if(adminViewingTasks){ renderTaskSubTabs(); }
      else if(session.role==='staff'){ rerenderStaffTab(); }
    }, err=>{ console.error('realtime sync ຜິດພາດ:', err); resolve(); });
  });
}
function unsubscribeTasks(){
  if(tasksUnsubscribe){ tasksUnsubscribe(); tasksUnsubscribe = null; }
}

async function loadAllAccountsFromServer(){
  const snap = await db.collection('mgmt_accounts').get();
  ACCOUNTS = snap.docs.map(doc => ({ username: doc.id, ...doc.data() }));
}
function persistTask(t){
  const { id, ...data } = t;
  db.collection('mgmt_tasks').doc(id).set(data).catch(err=>console.error('ບັນທຶກງານບໍ່ສຳເລັດ:', err));
}
function persistAccount(a){
  const { username, ...data } = a;
  db.collection('mgmt_accounts').doc(username).set(data).catch(err=>console.error('ບັນທຶກບັນຊີບໍ່ສຳເລັດ:', err));
}
function persistLoginLog(entry){
  db.collection('mgmt_loginlog').add(entry).catch(err=>console.error('ບັນທຶກປະຫວັດບໍ່ສຳເລັດ:', err));
}
function persistGoal(dept, date, text){
  db.collection('mgmt_goals').doc(dept+'_'+date).set({department:dept, date:date, text:text}).catch(err=>console.error('ບັນທຶກເປົ້າໝາຍບໍ່ສຳເລັດ:', err));
}
async function ensureGoalLoaded(dept, date){
  const key = dept+'|'+date;
  if(MOCK_GOALS[key] !== undefined) return;
  try{
    const doc = await db.collection('mgmt_goals').doc(dept+'_'+date).get();
    MOCK_GOALS[key] = doc.exists ? (doc.data().text || '') : '';
    const input = document.getElementById('dailyGoal');
    if(input && currentTaskDept===dept && viewingDate===date) input.value = MOCK_GOALS[key];
  }catch(err){ console.error('ໂຫຼດເປົ້າໝາຍບໍ່ສຳເລັດ:', err); }
}

// ===== ສ້າງບັນຊີແອດມິນເລີ່ມຕົ້ນອັດຕະໂນມັດ (eve / ActiveCEOEve) ຖ້າຍັງບໍ່ມີ =====
async function ensureBootstrapAdmin(){
  try{
    const doc = await db.collection('mgmt_accounts').doc('eve').get();
    if(!doc.exists){
      await db.collection('mgmt_accounts').doc('eve').set({
        password: 'ActiveCEOEve', name: 'Eve', role: 'admin', department: 'all'
      });
    }
  }catch(err){ console.error('ສ້າງບັນຊີເລີ່ມຕົ້ນບໍ່ສຳເລັດ:', err); }
}
function reloadTasksAndRefresh(){
  if(activeTab==='orgchart'){ renderOrgChart(); showOrg(currentOrgId); }
  else if(adminViewingTasks){ renderTaskSubTabs(); }
  else { rerenderStaffTab(); }
}

function renderLogin(){
  root.innerHTML = `
  <div class="card">
    <label>ຊື່ຜູ້ໃຊ້</label>
    <input id="u">
    <label>ລະຫັດຜ່ານ</label>
    <input id="p" type="password">
    <button onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button>
    <div class="err" id="err"></div>
  </div>`;
}

const SESSION_KEY = 'laoh_mgmt_session';
const SESSION_HOURS = 12;
function saveSession(s){
  localStorage.setItem(SESSION_KEY, JSON.stringify({...s, expiresAt: Date.now() + SESSION_HOURS*60*60*1000}));
}
function getSession(){
  const raw = localStorage.getItem(SESSION_KEY);
  if(!raw) return null;
  try{
    const s = JSON.parse(raw);
    if(Date.now() > s.expiresAt){ localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  }catch(e){ localStorage.removeItem(SESSION_KEY); return null; }
}
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

async function doLogin(){
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const errEl = document.getElementById('err');
  if(!u || !p){ errEl.textContent = 'ກະລຸນາປ້ອນຊື່ຜູ້ໃຊ້ ແລະ ລະຫັດຜ່ານ'; return; }
  errEl.textContent = 'ກຳລັງກວດສອບ...';
  try{
    const doc = await db.collection('mgmt_accounts').doc(u).get();
    if(!doc.exists || doc.data().password !== p){
      errEl.textContent = 'ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
      return;
    }
    errEl.textContent = '';
    const found = { username: u, ...doc.data() };
    session = found;
    saveSession(found);
    activeTab = 'orgchart';
    persistLoginLog({username:u, action:'login', at:new Date()});
    await Promise.all([loadAllAccountsFromServer(), subscribeToTasks()]);
    renderApp();
  }catch(e){
    errEl.textContent = 'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ: ' + e.message;
  }
}
function doLogout(){
  if(session) persistLoginLog({username:session.username, action:'logout', at:new Date()});
  session = null;
  clearSession();
  unsubscribeTasks();
  if(clockInterval) clearInterval(clockInterval);
  renderLogin();
}

let clockInterval = null;
function startClock(){
  if(clockInterval) clearInterval(clockInterval);
  updateClock();
  clockInterval = setInterval(updateClock, 1000);
}
function updateClock(){
  const el = document.getElementById('digitalClock');
  if(!el){ clearInterval(clockInterval); return; }
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const dateStr = DOW_LABEL[now.getDay()]+'. '+now.getDate()+' '+MONTH_LABEL[now.getMonth()]+' '+now.getFullYear();
  el.innerHTML = `<div style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:1px">${time}</div><div style="font-size:10px;opacity:.85;margin-top:1px">${dateStr}</div>`;
}

function setTab(k){ activeTab = k; renderApp(); }

function hasPendingTasks(deptKey){
  return MOCK_TASKS.some(t=>t.department===deptKey && t.status==='ລໍຖ້າອະນຸມັດ');
}
function renderOrgChart(){
  let html = '<div class="tree">'
    + '<div class="node" onclick="showOrg(\'board\')" id="node-board"><p class="t">ເຈົ້າຂອງບໍລິສັດ</p><p class="s">Eve + ຄູ່ຮ່ວມທຸລະກິດ</p></div>'
    + '<div class="connector"></div>'
    + '<div class="node" onclick="showOrg(\'ceo\')" id="node-ceo"><p class="t">CEO</p><p class="s">ຜູ້ບໍລິຫານສູງສຸດ</p></div>'
    + '<div class="dept-row">';
  ORG_TREE.forEach(grp=>{
    const head = ORG_DATA[grp.head];
    const pending = hasPendingTasks(grp.head);
    const pendingStyle = pending ? 'border-color:#9C6B22;border-width:2px;background:#FAECE7' : '';
    html += '<div class="col"><div class="stub"></div>'
      + '<div class="node" onclick="showOrg(\''+grp.head+'\')" id="node-'+grp.head+'" style="'+pendingStyle+'">'
      + (pending ? '<span style="float:right;font-size:12px">⏳</span>' : '')
      + '<p class="t">'+head.title+'</p><p class="s">'+head.role+'</p></div>'
      + '<div class="staffwrap">'
      + grp.staff.map(sid=>'<div class="chip" onclick="showOrg(\''+sid+'\')" id="node-'+sid+'">'+ORG_DATA[sid].title+'</div>').join('')
      + '</div></div>';
  });
  html += '</div></div><div id="orgDetail" style="margin-top:16px;border-top:0.5px solid var(--line);padding-top:12px"></div>';
  document.getElementById('content').innerHTML = html;
  showOrg('board');
}
let currentOrgId = 'board';
function showOrg(id){
  currentOrgId = id;
  document.querySelectorAll('[id^="node-"]').forEach(c=>c.classList.remove('active'));
  const el = document.getElementById('node-'+id);
  if(el) el.classList.add('active');
  const d = ORG_DATA[id];
  let pendingHtml = '';
  if(DEPT_LABEL[id]){
    const pending = MOCK_TASKS.filter(t=>t.department===id && t.status==='ລໍຖ້າອະນຸມັດ');
    if(pending.length>0){
      pendingHtml = '<div style="margin-top:16px;padding-top:14px;border-top:1px dashed #9C6B22">'
        + '<div style="font-size:12px;color:#9C6B22;font-weight:600;margin-bottom:8px">⏳ ງານທີ່ລໍຖ້າການອະນຸມັດ ('+pending.length+')</div>'
        + pending.map(t=>renderPendingTaskBlock(t)).join('')
        + '</div>';
    }
  }
  document.getElementById('orgDetail').innerHTML = `
    <p style="font-size:11px;color:var(--muted);text-transform:uppercase;margin:0 0 2px">${d.eyebrow}</p>
    <h3 style="margin:0 0 2px;font-size:16px">${d.title}</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 8px">${d.role}</p>
    <ul style="margin:0;padding-left:18px;font-size:14px">${d.duties.map(x=>'<li style="margin-bottom:4px">'+x+'</li>').join('')}</ul>
    ${pendingHtml}`;
}

function renderPendingTaskBlock(t){
  return `<div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:10px">
    <strong style="font-size:13px">${escapeHtml(t.title)}</strong>
    ${t.description ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+escapeHtml(t.description)+'</div>' : ''}
    <div style="font-size:10px;color:var(--muted);margin-top:4px">ສະເໜີໂດຍ ${escapeHtml(t.assignedBy)}</div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto">
      ${t.updates.length===0 ? '<div style="font-size:12px;color:var(--muted)">ຍັງບໍ່ມີການອັບເດດ</div>' : t.updates.map(u=>`
        <div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${escapeHtml(u.author)} · ${fmtDate(u.at)}</div>
          <div style="font-size:12px">${escapeHtml(u.text)}</div>
        </div>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input id="orginput-${t.id}" placeholder="ພິມຄຳຕອບກັບ...">
      <button onclick="orgAddTaskMessage('${t.id}')" style="margin:0;white-space:nowrap">ຕອບກັບ</button>
    </div>
    <div class="statusrow" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-top:10px">
      ${STATUS_OPTIONS.map(s=>`<span class="radio ${t.status===s?'active':''}" style="color:${STATUS_COLOR[s]}" onclick="orgSetTaskStatus('${t.id}','${s}')"><span class="dot"></span>${s}</span>`).join('')}
    </div>
    <button onclick="orgSetTaskStatus('${t.id}','ຍັງບໍ່ເລີ່ມ')" style="margin-top:8px;background:#0F6E56;color:#fff;border-color:#0F6E56">✓ ອະນຸມັດ</button>
  </div>`;
}
function orgAddTaskMessage(id){
  const input = document.getElementById('orginput-'+id);
  const text = input.value.trim();
  if(!text) return;
  const t = MOCK_TASKS.find(x=>x.id===id);
  t.updates.push({author: session.name, at: new Date(), text: text});
  persistTask(t);
  renderOrgChart();
  showOrg(currentOrgId);
}
function orgSetTaskStatus(id, status){
  const t = MOCK_TASKS.find(x=>x.id===id);
  t.status = status;
  persistTask(t);
  renderOrgChart();
  showOrg(currentOrgId);
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ return d.toLocaleString('lo-LA', {dateStyle:'medium', timeStyle:'short'}); }

// ===== ແທັບ: ລາຍງານ (ແອດມິນ) — ໃຊ້ລະບົບຕາຕະລາງງານແບບດຽວກັບພະນັກງານ =====
function renderReportsAdmin(){
  adminViewingTasks = true;
  if(!currentTaskDept) currentTaskDept = 'all';
  if(!staffTab) staffTab = 'daily';
  const deptKeys = ['all', ...Object.keys(DEPT_LABEL).filter(k=>k!=='all')];
  const deptChips = deptKeys.map(k=>{
    const label = k==='all' ? 'ທຸກຝ່າຍ' : DEPT_LABEL[k];
    const active = currentTaskDept===k;
    let style = '';
    if(k!=='all') style = active ? `background:${DEPT_COLOR[k]};border-color:${DEPT_COLOR[k]}` : `color:${DEPT_COLOR[k]};border-color:${DEPT_COLOR[k]}`;
    return `<div class="tab ${active?'active':''}" style="${style}" onclick="setTaskDeptView('${k}')">${label}</div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <span onclick="reloadTasksAndRefresh()" style="font-size:11px;color:var(--dot);cursor:pointer">⟳ ໂຫຼດຂໍ້ມູນລ່າສຸດ</span>
    </div>

    const rows = MOCK_TASKS.filter(t=>t.department===dept).map(t=>({
      'ຫົວຂໍ້ງານ': t.title,
      'ລາຍລະອຽດ': t.description,
      'ກຳນົດສົ່ງ': t.dueDate,
      'ສະຖານະ': t.status,
      'ຜູ້ຮັບຜິດຊອບ': assigneeName(t.assignee),
      'ມອບໝາຍໂດຍ': t.by==='ຫົວໜ້າ' ? 'ຫົວໜ້າ' : 'ພະນັກງານ (ເພີ່ມເອງ)',
      'ຈຳນວນອັບເດດ': t.updates.length
    }));
    if(rows.length===0){
      rows.push({'ຫົວຂໍ້ງານ':'(ບໍ່ມີງານ)','ລາຍລະອຽດ':'','ກຳນົດສົ່ງ':'','ສະຖານະ':'','ຜູ້ຮັບຜິດຊອບ':'','ມອບໝາຍໂດຍ':'','ຈຳນວນອັບເດດ':''});
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, DEPT_LABEL[dept]);
  });
  const info = [
    {'ໝາຍເຫດ':'ໄຟລ໌ນີ້ແມ່ນຂໍ້ມູນປັດຈຸບັນສຳລັບເບິ່ງ/ເກັບໄວ້ເທົ່ານັ້ນ'},
    {'ໝາຍເຫດ':'ຫ້າມອັບໂຫລດໄຟລ໌ນີ້ກັບຄືນເຂົ້າເວັບ ຈະເຮັດໃຫ້ງານຊ້ຳກັນ'},
    {'ໝາຍເຫດ':'ຖ້າຈະເພີ່ມງານໃໝ່ ໃຫ້ໃຊ້ປຸ່ມ "ດາວໂຫຼດຟອມເປົ່າ" ແທນ'},
    {'ໝາຍເຫດ':'ຖ້າຈະແກ້ໄຂງານທີ່ມີຢູ່ແລ້ວ ໃຫ້ແກ້ໄຂຜ່ານໜ້າເວັບໂດຍກົງ'}
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(info), 'ໝາຍເຫດ');
  XLSX.writeFile(wb, 'LaoH_ຂໍ້ມູນປັດຈຸບັນ_'+todayISO()+'.xlsx');
}

// ===== Excel: ອັບໂຫລດ — ເພີ່ມງານໃໝ່ເທົ່ານັ້ນ ບໍ່ແກ້ໄຂງານເກົ່າ =====
function handleExcelUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      let added=0;
      Object.keys(DEPT_LABEL).filter(k=>k!=='all').forEach(dept=>{
        const sheetName = DEPT_LABEL[dept];
        const ws = wb.Sheets[sheetName];
        if(!ws) return;
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        rows.forEach(r=>{
          const title = String(r['ຫົວຂໍ້ງານ']||'').trim();
          if(!title) return;
          const description = String(r['ລາຍລະອຽດ']||'').trim();
          const dueDateRaw = String(r['ກຳນົດສົ່ງ (YYYY-MM-DD)']||'').trim();
          const dueDate = dueDateRaw || todayISO();
          let status = String(r['ສະຖານະ']||'').trim();
          if(!STATUS_OPTIONS.includes(status)) status = STATUS_OPTIONS[0];
          let assignee = String(r['ຜູ້ຮັບຜິດຊອບ (username)']||'').trim();
          if(assignee && !ACCOUNTS.find(a=>a.username===assignee)) assignee = '';
          const newTask = {
            id: 't'+Date.now()+Math.random().toString(36).slice(2,6),
            department: dept, title, description, dueDate, status,
            updates: [], editHistory: [], assignee: assignee,
            assignedBy: session.username, by:'ຫົວໜ້າ'
          };
          MOCK_TASKS.unshift(newTask);
          persistTask(newTask);
          added++;
        });
      });
      alert(added>0 ? 'ອັບໂຫລດສຳເລັດ: ເພີ່ມງານໃໝ່ '+added+' ລາຍການ (ງານເກົ່າບໍ່ຖືກແກ້ໄຂ)' : 'ບໍ່ພົບແຖວທີ່ມີຫົວຂໍ້ງານ ລອງກວດຟອມອີກຄັ້ງ');
    }catch(err){
      alert('ອ່ານໄຟລ໌ບໍ່ສຳເລັດ: ' + err.message);
    }
    e.target.value = '';
    renderReportsAdmin();
  };
  reader.readAsArrayBuffer(file);
}
function renderTaskSubTabs(){
  const tabs = [['daily','ປະຈຳວັນ'],['weekly','ປະຈຳອາທິດ'],['monthly','ປະຈຳເດືອນ'],['all','ທັງໝົດ']];
  document.getElementById('taskSubTabs').innerHTML = tabs.map(([k,v])=>`<div class="tab ${staffTab===k?'active':''}" onclick="setStaffTab('${k}')">${v}</div>`).join('');
  if(staffTab==='daily') renderStaffDaily();
  else if(staffTab==='weekly') renderStaffWeekly();
  else if(staffTab==='monthly') renderStaffCalendar();
  else renderStaffAllTab();
}

// ===== ແທັບ: ມອບໝາຍງານ (ແອດມິນ) =====
function assigneeOptions(dept){
  const list = ACCOUNTS.filter(a=>a.department===dept);
  if(list.length===0) return '<option value="">(ຍັງບໍ່ມີພະນັກງານຝ່າຍນີ້)</option>';
  return list.map(a=>`<option value="${a.username}">${escapeHtml(a.name)}</option>`).join('');
}
function updateTaskAssigneeOptions(){
  document.getElementById('taskAssignee').innerHTML = assigneeOptions(document.getElementById('taskDept').value);
}
function renderTasksAdmin(){
  const deptOptions = Object.entries(DEPT_LABEL).filter(([k])=>k!=='all').map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const firstDept = Object.keys(DEPT_LABEL).filter(k=>k!=='all')[0];
  document.getElementById('content').innerHTML = `
    <label>ຝ່າຍ</label><select id="taskDept" onchange="updateTaskAssigneeOptions()">${deptOptions}</select>
    <label>ຫົວຂໍ້ງານ</label><input id="taskTitle">
    <label>ລາຍລະອຽດ</label><input id="taskDesc">
    <label>ກຳນົດສົ່ງ</label><input type="date" id="taskDue">
    <label>ຜູ້ຮັບຜິດຊອບ</label><select id="taskAssignee">${assigneeOptions(firstDept)}</select>
    <button onclick="submitTask()">ມອບໝາຍງານ</button>
    <div class="err" id="taskMsg"></div>
    <div id="taskListAdmin" style="margin-top:16px"></div>`;
  loadTasksAdmin();

function submitTask(){
  const title = document.getElementById('taskTitle').value.trim();
  const msgEl = document.getElementById('taskMsg');
  if(!title){ msgEl.textContent = 'ປ້ອນຫົວຂໍ້ງານກ່ອນ'; return; }
  const newTask = {
    id: 't'+Date.now(),
    department: document.getElementById('taskDept').value,
    title: title,
    description: document.getElementById('taskDesc').value.trim(),
    dueDate: document.getElementById('taskDue').value || todayISO(),
    status: 'ຍັງບໍ່ເລີ່ມ', updates:[], editHistory:[],
    assignee: document.getElementById('taskAssignee').value,
    assignedBy: session.username, by:'ຫົວໜ້າ'
  };
  MOCK_TASKS.unshift(newTask);
  persistTask(newTask);
  msgEl.style.color = '#0F6E56';
  msgEl.textContent = 'ມອບໝາຍງານແລ້ວ';
  document.getElementById('taskTitle').value='';
  document.getElementById('taskDesc').value='';
  document.getElementById('taskDue').value='';
  loadTasksAdmin();
}
let adminTaskEditOpenId = null;
function loadTasksAdmin(){
  const el = document.getElementById('taskListAdmin');
  if(MOCK_TASKS.length===0){ el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:1rem 0">ຍັງບໍ່ມີງານທີ່ມອບໝາຍ</p>'; return; }
  el.innerHTML = MOCK_TASKS.map(d=>{
    const open = adminTaskEditOpenId===d.id;
    return `
    <div style="border-top:0.5px solid var(--line);padding:10px 0;font-size:13px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="toggleAdminTaskEdit('${d.id}')">
        <div>
          <div style="color:var(--muted);font-size:12px;margin-bottom:3px">${DEPT_LABEL[d.department]} · <span style="color:${STATUS_COLOR[d.status]||'var(--muted)'}">${d.status}</span>${d.dueDate?' · ກຳນົດ '+d.dueDate:''} · ຮັບຜິດຊອບ: ${escapeHtml(assigneeName(d.assignee))}</div>
          <strong>${escapeHtml(d.title)}</strong>
          ${d.description ? '<div style="margin-top:2px">'+escapeHtml(d.description)+'</div>' : ''}
          ${d.updates && d.updates.length>0 ? '<div style="color:var(--muted);margin-top:2px">ອັບເດດລ່າສຸດ: '+escapeHtml(d.updates[d.updates.length-1].text)+' ('+escapeHtml(d.updates[d.updates.length-1].author)+')</div>' : ''}
        </div>
        <span style="font-size:11px;color:var(--dot);white-space:nowrap;margin-left:8px">${open?'▾ ປິດ':'✎ ແກ້ໄຂ'}</span>
      </div>
      ${open ? `
      <div style="background:var(--bg);border-radius:8px;padding:10px;margin-top:10px">
        <label style="margin-top:0">ຫົວຂໍ້ງານ</label><input id="admEditTitle-${d.id}" value="${escapeHtml(d.title)}">
        <label>ລາຍລະອຽດ</label><input id="admEditDesc-${d.id}" value="${escapeHtml(d.description)}">
        <label>ກຳນົດສົ່ງ</label><input type="date" id="admEditDue-${d.id}" value="${d.dueDate}">
        <label>ຜູ້ຮັບຜິດຊອບ</label><select id="admEditAssignee-${d.id}">${assigneeOptions(d.department)}</select>
        <label>ສະຖານະ</label>
        <div class="statusrow" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-top:4px">
          ${STATUS_OPTIONS.map(s=>`<span class="radio ${d.status===s?'active':''}" style="color:${STATUS_COLOR[s]}" onclick="setAdminEditStatus('${d.id}','${s}')" id="admstatus-${d.id}-${s}"><span class="dot"></span>${s}</span>`).join('')}
        </div>
        <button onclick="saveAdminTaskEdit('${d.id}')" style="margin-top:10px">ບັນທຶກການແກ້ໄຂ</button>
      </div>` : ''}
    </div>`;
  }).join('');
  if(adminTaskEditOpenId){
    const sel = document.getElementById('admEditAssignee-'+adminTaskEditOpenId);
    if(sel){
      const t = MOCK_TASKS.find(x=>x.id===adminTaskEditOpenId);
      if(t) sel.value = t.assignee || '';
    }
  }
}
function toggleAdminTaskEdit(id){
  adminTaskEditOpenId = (adminTaskEditOpenId===id) ? null : id;
  loadTasksAdmin();
}
let pendingAdminStatus = {};
function setAdminEditStatus(id, status){
  pendingAdminStatus[id] = status;
  STATUS_OPTIONS.forEach(s=>{
    const chip = document.getElementById('admstatus-'+id+'-'+s);
    if(chip) chip.classList.toggle('active', s===status);
  });
}
function saveAdminTaskEdit(id){
  const t = MOCK_TASKS.find(x=>x.id===id);
  const newTitle = document.getElementById('admEditTitle-'+id).value.trim();
  if(!newTitle) return;
  const newDesc = document.getElementById('admEditDesc-'+id).value.trim();
  const newDue = document.getElementById('admEditDue-'+id).value || t.dueDate;
  const newAssignee = document.getElementById('admEditAssignee-'+id).value;
  const newStatus = pendingAdminStatus[id] || t.status;
  const changes = [];
  if(newTitle !== t.title) changes.push('ປ່ຽນຫົວຂໍ້ຈາກ "'+t.title+'" ເປັນ "'+newTitle+'"');
  if(newDesc !== t.description) changes.push('ປ່ຽນລາຍລະອຽດ');
  if(newDue !== t.dueDate) changes.push('ປ່ຽນກຳນົດສົ່ງເປັນ '+newDue);
  if(newAssignee !== t.assignee) changes.push('ປ່ຽນຜູ້ຮັບຜິດຊອບເປັນ '+assigneeName(newAssignee));
  if(newStatus !== t.status) changes.push('ປ່ຽນສະຖານະເປັນ '+newStatus);
  if(changes.length > 0){
    if(!t.editHistory) t.editHistory = [];
    t.editHistory.push({author: session.name, at: new Date(), change: changes.join(' · ')});
  }
  t.title = newTitle;
  t.description = newDesc;
  t.dueDate = newDue;
  t.assignee = newAssignee;
  t.status = newStatus;
  persistTask(t);
  delete pendingAdminStatus[id];
  loadTasksAdmin();
}

  if(ACCOUNTS.find(a=>a.username===username)){ msgEl.textContent = 'ຊື່ຜູ້ໃຊ້ນີ້ມີແລ້ວ'; return; }
  const role = document.getElementById('accRole').value;
  const newAccount = {username, password, name, role, department: role==='admin' ? 'all' : document.getElementById('accDept').value};
  ACCOUNTS.push(newAccount);
  persistAccount(newAccount);
  msgEl.style.color = '#0F6E56';
  msgEl.textContent = 'ສ້າງບັນຊີ "'+username+'" ແລ້ວ';
  document.getElementById('accUsername').value='';
  document.getElementById('accPassword').value='';
  document.getElementById('accName').value='';
  loadAccountsAdmin();
}

async function renderLoginLog(){
  const el = document.getElementById('content');
  el.innerHTML = '<p style="color:var(--muted)">ກຳລັງໂຫຼດ...</p>';
  try{
    const snap = await db.collection('mgmt_loginlog').orderBy('at','desc').limit(100).get();
    if(snap.empty){ el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:1rem 0">ຍັງບໍ່ມີປະຫວັດ</p>'; return; }
    const rows = snap.docs.map(doc=>{
      const d = doc.data();
      const at = d.at && d.at.toDate ? d.at.toDate() : new Date(d.at);
      return `<tr><td>${escapeHtml(d.username)}</td><td>${d.action==='login'?'ເຂົ້າສູ່ລະບົບ':'ອອກຈາກລະບົບ'}</td><td>${fmtDate(at)}</td></tr>`;
    }).join('');
    el.innerHTML = `<table><thead><tr><th>ຜູ້ໃຊ້</th><th>ການກະທຳ</th><th>ເວລາ</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(e){
    el.innerHTML = '<p class="err">ໂຫຼດບໍ່ສຳເລັດ: '+e.message+'</p>';
  }
}

function fmtDateLao(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return DOW_LABEL[d.getDay()]+'. '+d.getDate()+' '+MONTH_LABEL[d.getMonth()]+' '+d.getFullYear();
}
function getWeekRange(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMon = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMon);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const toISO = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return [toISO(monday), toISO(sunday)];
}

function saveGoal(v){

function assigneeName(username){
  if(!username) return 'ຍັງບໍ່ທັນມອບໝາຍ';
  const a = ACCOUNTS.find(x=>x.username===username);
  return a ? a.name : username;
}
function toggleTaskRow(id){
  const row = document.getElementById('expand-'+id);
  const arrow = document.getElementById('arrow-'+id);
  const open = row.style.display === 'table-row';
  row.style.display = open ? 'none' : 'table-row';
  arrow.textContent = open ? '▸' : '▾';
  openExpandId = open ? null : id;
}
function toggleEditForm(id){
  const form = document.getElementById('editform-'+id);
  form.style.display = (form.style.display==='block') ? 'none' : 'block';
}
function saveTaskEdit(id){
  const t = MOCK_TASKS.find(x=>x.id===id);
  const newTitle = document.getElementById('editTitle-'+id).value.trim();
  const newDesc = document.getElementById('editDesc-'+id).value.trim();
  if(!newTitle) return;
  const changes = [];
  if(newTitle !== t.title) changes.push('ປ່ຽນຫົວຂໍ້ຈາກ "'+t.title+'" ເປັນ "'+newTitle+'"');
  if(newDesc !== t.description) changes.push('ປ່ຽນລາຍລະອຽດ');
  if(changes.length > 0){
    if(!t.editHistory) t.editHistory = [];
    t.editHistory.push({author: session.name, at: new Date(), change: changes.join(' · ')});
  }
  t.title = newTitle;
  t.description = newDesc;
  persistTask(t);
  refreshAllTaskViews();
  reopenExpand(id);
}
function refreshAllTaskViews(){
  if(activeTab==='orgchart'){ renderOrgChart(); showOrg(currentOrgId); }
  else if(adminViewingTasks){ renderTaskSubTabs(); }
  else { rerenderStaffTab(); }
}
function rerenderStaffTab(){
  if(staffTab==='daily') renderStaffDaily();
  else if(staffTab==='weekly') renderStaffWeekly();
  else if(staffTab==='all') renderStaffAllTab();
}
function setTaskStatus(id, status){
  const t = MOCK_TASKS.find(x=>x.id===id);
  t.status = status;
  persistTask(t);
  rerenderStaffTab();
}
function reopenExpand(id){
  openExpandId = id;
  const row = document.getElementById('expand-'+id);
  if(row) row.style.display = 'table-row';
  const arrow = document.getElementById('arrow-'+id);
  if(arrow) arrow.textContent = '▾';
}
function addTaskMessage(id){
  const input = document.getElementById('chatinput-'+id);
  const text = input.value.trim();
  if(!text) return;
  const t = MOCK_TASKS.find(x=>x.id===id);
  t.updates.push({author: session.name, at: new Date(), text: text});
  persistTask(t);
  refreshAllTaskViews();
  reopenExpand(id);
  const chat = document.getElementById('chat-'+id);
  if(chat) chat.scrollTop = chat.scrollHeight;
}
function toggleMsgEdit(taskId, idx){
  const el = document.getElementById('msgedit-'+taskId+'-'+idx);
  if(el) el.style.display = (el.style.display==='block') ? 'none' : 'block';
}
function saveMsgEdit(taskId, idx){
  const t = MOCK_TASKS.find(x=>x.id===taskId);
  const u = t.updates[idx];
  const newText = document.getElementById('msgeditinput-'+taskId+'-'+idx).value.trim();
  if(!newText || newText===u.text){
    const el = document.getElementById('msgedit-'+taskId+'-'+idx);
    if(el) el.style.display = 'none';
    return;
  }
  if(!u.editHistory) u.editHistory = [];
  u.editHistory.push({text: u.text, at: u.editedAt || u.at});
  u.text = newText;
  u.editedAt = new Date();
  persistTask(t);
  refreshAllTaskViews();
  reopenExpand(taskId);
}
function toggleMsgHistory(taskId, idx){
  const el = document.getElementById('msghist-'+taskId+'-'+idx);
  if(el) el.style.display = (el.style.display==='block') ? 'none' : 'block';
}

      <label>ຜູ້ຮັບຜິດຊອບ</label><select id="newTaskAssignee">${assigneeOptions(currentTaskDept)}</select>
      <button onclick="addOwnTask()">ບັນທຶກຫົວຂໍ້</button>
      <div class="err" id="newTaskMsg"></div>
    </div>`;
  if(session.role==='staff'){
    const sel = document.getElementById('newTaskAssignee');
    if(sel) sel.value = session.username;
  }
}
function addOwnTask(){
  const title = document.getElementById('newTaskTitle').value.trim();
  const msgEl = document.getElementById('newTaskMsg');
  if(!title){ msgEl.textContent = 'ປ້ອນຊື່ຫົວຂໍ້ກ່ອນ'; return; }
  const isAdmin = session.role === 'admin';
  const newTask = {
    id: 't'+Date.now(),
    department: currentTaskDept,
    title: title,
    description: document.getElementById('newTaskDesc').value.trim(),
    dueDate: document.getElementById('newTaskDate').value || viewingDate,
    status: isAdmin ? 'ຍັງບໍ່ເລີ່ມ' : 'ລໍຖ້າອະນຸມັດ', updates:[], editHistory:[],
    assignee: document.getElementById('newTaskAssignee').value,
    assignedBy: session.username, by: isAdmin ? 'ຫົວໜ້າ' : 'ພະນັກງານ'
  };
  MOCK_TASKS.unshift(newTask);
  persistTask(newTask);
  rerenderStaffTab();
}

function renderStaffCalendar(){
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const myTasks = MOCK_TASKS.filter(t=>currentTaskDept==='all' || t.department===currentTaskDept);

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div></div>';
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dayTasks = myTasks.filter(t=>t.dueDate===dateStr);
    const isToday = dateStr === todayISO();
    cells += `<div onclick="goToDate('${dateStr}')" style="border:0.5px solid var(--line);border-radius:6px;min-height:64px;padding:4px;cursor:pointer;${isToday?'background:var(--bg);border-color:var(--dot)':''}">
      <div style="font-size:11px;color:var(--muted)">${day}</div>
      ${dayTasks.slice(0,2).map(t=>'<div style="font-size:10px;background:'+(STATUS_COLOR[t.status]||'var(--muted)')+';color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(t.title)+'</div>').join('')}
      ${dayTasks.length>2 ? '<div style="font-size:10px;color:var(--muted)">+'+(dayTasks.length-2)+'</div>' : ''}
    </div>`;
  }

  document.getElementById('staffTabBody').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button onclick="shiftMonth(-1)" style="margin:0;padding:8px 10px">‹</button>
      <div style="font-weight:600">${MONTH_LABEL[month]} ${year}</div>
      <button onclick="shiftMonth(1)" style="margin:0;padding:8px 10px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px">
      ${DOW_LABEL.map(d=>'<div>'+d+'</div>').join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>`;
}
function shiftMonth(delta){
  calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth()+delta, 1);
  renderStaffCalendar();
}

(async function bootstrap(){
  await ensureBootstrapAdmin();
  const s = getSession();
  if(!s){ renderLogin(); return; }
  session = s;
  activeTab = 'orgchart';
  try{
    await Promise.all([loadAllAccountsFromServer(), subscribeToTasks()]);
    renderApp();
  }catch(e){
    clearSession();
    renderLogin();
  }
})();
</script>
</body>
</html>
